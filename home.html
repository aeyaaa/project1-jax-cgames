<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        body {
            background-color: #000000;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            text-align: center;
            color: #fff;
        }
        .game-list {
            list-style-type: none;
        }
        .game-list li {
            margin: 10px 0
        }
        button {
            width: 200px;
            padding: 10px 10px;
            font-size: 18px;
            background-color: #950707;
            color: antiquewhite;
            border: none;
            border-radius: 5px;
            cursor: pointer
        }
        button:hover {
            background-color: #c83030;
            color: #e4e0e0;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>Choose a Game</h1>
        <ul class="game-list">
            <li>
                <button onclick="window.location.href='tictactoe.html'">Tic-Tac-Toe</button>
            </li>
            <li>
                <button onclick="window.location.href='racing.html'">Racing</button>
            </li>
            <li>
                <button onclick="window.location.href='snake.html'">Snake</button>
            </li>
            <li>
                <button onclick="window.location.href='tetris.html'">Tetris</button>
            </li>

        </ul>
    </div>
</body>
</html>
