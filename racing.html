<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game</title>
    <link rel="stylesheet" href="/css/racing.css">  <!-- Links to racing-specific CSS. -->
</head>
<body>
    <div>
        <h1>Car Racing</h1>
        <p id="score">Score: 0</p>  <!-- Displays the current score. -->
        <canvas id="gameCanvas" width="1700" height="380"></canvas>  <!-- Canvas for drawing the game. -->
        <p>Use ↑↓ arrows to move the car. Avoid obstacles!</p>
    </div>
    
    <div id="modal" class="modal">  <!-- Modal for game over. -->
        <div class="modal-content">
            <p id="modalMessage">Game Over! Score: 0</p>
            <button id="playAgainButton">Play Again</button>
        </div>
    </div>
    
    <script src="/js/racing-script.js"></script>  <!-- Links to racing-specific JS. -->
</body>
</html>
